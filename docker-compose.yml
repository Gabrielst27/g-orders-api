services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gorders-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN}
    ports:
      - "8080:8080"